openapi: 3.0.3
info:
  title: Pinelab Corporate Website API
  description: 松果創意 Pinelab 企業官網 API 規範
  version: 1.0.0
  contact:
    name: Pinelab API Support

servers:
  - url: http://localhost:8000/api
    description: 開發環境
  - url: https://api.pinelab.example.com/api
    description: 生產環境

paths:
  # ==================== 公開端點 ====================
  
  /products/:
    get:
      summary: 取得商品列表
      description: 取得商品列表，支援篩選、搜尋、排序和分頁
      tags:
        - Products
      parameters:
        - name: category
          in: query
          description: 分類 ID 篩選
          schema:
            type: integer
        - name: tags
          in: query
          description: 標籤 ID 列表（多選）
          schema:
            type: array
            items:
              type: integer
        - name: min_price
          in: query
          description: 最小價格
          schema:
            type: number
            format: decimal
        - name: max_price
          in: query
          description: 最大價格
          schema:
            type: number
            format: decimal
        - name: search
          in: query
          description: 關鍵字搜尋（商品名稱、描述、標籤）
          schema:
            type: string
        - name: sort
          in: query
          description: 排序方式（sort_order, updated_at, price, -price）
          schema:
            type: string
            default: sort_order
        - name: page
          in: query
          description: 頁碼
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: 每頁筆數
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
  
  /products/{id}/:
    get:
      summary: 取得商品詳情
      description: 取得單一商品的完整資訊
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          description: 商品 ID
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /categories/:
    get:
      summary: 取得分類列表
      description: 取得所有啟用的分類列表
      tags:
        - Categories
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
  
  /tags/:
    get:
      summary: 取得標籤列表
      description: 取得所有標籤列表
      tags:
        - Tags
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
  
  /contact/:
    post:
      summary: 提交聯絡表單
      description: 提交聯絡表單（需 HMAC-SHA256 簽章）
      tags:
        - Contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        '201':
          description: 成功建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
  
  # ==================== 認證端點 ====================
  
  /auth/login/:
    post:
      summary: 管理員登入
      description: 管理員登入，取得 JWT Token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /auth/me/:
    get:
      summary: 取得當前使用者資訊
      description: 取得當前已認證的使用者資訊
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  # ==================== 管理端點 ====================
  
  /admin/products/:
    get:
      summary: 取得所有商品（管理員）
      description: 管理員取得所有商品列表
      tags:
        - Admin - Products
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    
    post:
      summary: 建立商品（管理員）
      description: 管理員建立新商品（支援多張圖片上傳）
      tags:
        - Admin - Products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: 成功建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  
  /admin/products/{id}/:
    patch:
      summary: 更新商品（管理員）
      description: 管理員更新商品資訊（含排序調整）
      tags:
        - Admin - Products
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: 成功更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      summary: 刪除商品（管理員）
      description: 管理員刪除商品
      tags:
        - Admin - Products
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 成功刪除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /admin/products/{id}/images/:
    post:
      summary: 新增商品圖片（管理員）
      description: 為商品新增圖片（支援多檔上傳）
      tags:
        - Admin - Products
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: 成功上傳
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
    
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        code:
          type: string
        message:
          type: string
        errors:
          type: object
    
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 200
        slug:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
          minimum: 0
        sort_order:
          type: integer
        category:
          $ref: '#/components/schemas/Category'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    ProductListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                count:
                  type: integer
                next:
                  type: string
                  nullable: true
                previous:
                  type: string
                  nullable: true
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
    
    ProductDetailResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Product'
    
    ProductCreateRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        price:
          type: number
          format: decimal
          minimum: 0
        category_id:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: integer
        sort_order:
          type: integer
        images:
          type: array
          items:
            type: string
            format: binary
    
    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        price:
          type: number
          format: decimal
          minimum: 0
        category_id:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: integer
        sort_order:
          type: integer
        is_active:
          type: boolean
    
    ProductImage:
      type: object
      properties:
        id:
          type: integer
        image_url:
          type: string
        full_url:
          type: string
        sort_order:
          type: integer
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
    
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        is_active:
          type: boolean
    
    CategoryListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Category'
    
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    
    TagListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Tag'
    
    ContactRequest:
      type: object
      required:
        - name
        - email
        - message
        - sign
        - timestamp
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        message:
          type: string
          minLength: 10
          maxLength: 2000
        sign:
          type: string
          description: HMAC-SHA256 簽章
        timestamp:
          type: integer
          description: UNIX timestamp (毫秒)
    
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                user:
                  $ref: '#/components/schemas/User'
    
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
          nullable: true
    
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    
    ImageListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProductImage'
  
  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    Unauthorized:
      description: 未認證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    Forbidden:
      description: 無權限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    ValidationError:
      description: 資料驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Products
    description: 商品相關 API
  - name: Categories
    description: 分類相關 API
  - name: Tags
    description: 標籤相關 API
  - name: Contact
    description: 聯絡表單 API
  - name: Auth
    description: 認證相關 API
  - name: Admin - Products
    description: 商品管理 API（需管理員權限）
  - name: Admin - Categories
    description: 分類管理 API（需管理員權限）
  - name: Admin - Tags
    description: 標籤管理 API（需管理員權限）
  - name: Admin - Contacts
    description: 聯絡表單管理 API（需管理員權限）

