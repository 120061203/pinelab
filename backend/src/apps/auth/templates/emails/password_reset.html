<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>密碼重設通知</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 5px;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>密碼重設通知</h2>
        <p>您好，</p>
        <p>我們收到您要求重設密碼的請求。請點擊以下按鈕重設您的密碼：</p>
        <p>
            <a href="{{ reset_url }}" class="button">重設密碼</a>
        </p>
        <p>或者複製以下連結到瀏覽器：</p>
        <p style="word-break: break-all; color: #007bff;">{{ reset_url }}</p>
        <p>此連結將在 24 小時後失效。</p>
        <p>如果您沒有請求重設密碼，請忽略此郵件。</p>
        <div class="footer">
            <p>此為系統自動發送的郵件，請勿回覆。</p>
        </div>
    </div>
</body>
</html>
