[pytest]
DJANGO_SETTINGS_MODULE = pinelab.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
testpaths = tests

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

