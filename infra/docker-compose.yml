version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pinelab
      POSTGRES_USER: pinelab_user
      POSTGRES_PASSWORD: pinelab_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinelab_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pinelab_user:pinelab_password@db:5432/pinelab
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../backend/.env

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    command: npm run dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:

